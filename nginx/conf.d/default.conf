# =====================================================
# Main Domain: kukey.com (Landing Page)
# =====================================================
server {
    listen 80;
    listen [::]:80;
    server_name kukey.com www.kukey.com;

    # Let's Encrypt webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Redirect to HTTPS once certificates are issued
        # return 301 https://$host$request_uri;
        
        # Temporary static response for initial deployment without certs
        add_header Content-Type text/html;
        return 200 '<!DOCTYPE html><html><head><title>Kukey Tech</title><style>body{font-family:sans-serif;text-align:center;padding:50px;color:#333;background:#f9f9f9;}h1{color:#6366f1;}</style></head><body><h1>Kukey Tech Blog</h1><p>Welcome to our technology and innovation blog.</p></body></html>';
    }
}

